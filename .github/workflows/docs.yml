name: Docs

on:
  pull_request:
    paths:
      - ".github/workflows/docs.yml"
      - ".github/workflows/reusable-docs.yml"
      - ".lychee.toml"
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "scripts/docs.sh"
      - "src/cssm/**"
      - "ssms/**"
      - "uv.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - ".github/workflows/reusable-docs.yml"
      - ".lychee.toml"
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "scripts/docs.sh"
      - "src/cssm/**"
      - "ssms/**"
      - "uv.lock"
  schedule:
    # Retain the established Monday 06:23 UTC rendered-link check.
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs:
    uses: ./.github/workflows/reusable-docs.yml
    with:
      system-profile: gsl
