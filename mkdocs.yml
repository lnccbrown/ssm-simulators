site_name: SSMS (Sequential Sampling Model Simulators)
repo_name: lnccbrown/ssm-simulators
repo_url: https://github.com/lnccbrown/ssm-simulators
site_url: https://lnccbrown.github.io/ssm-simulators
edit_uri: edit/main/docs
exclude_docs: |
  overrides/
  snippets/
  core_tutorials/tutorial_capabilities.ipynb

nav:
  - Home:
      - Overview: index.md
      - The HSSM ecosystem: https://lnccbrown.github.io/HSSM/ecosystem/
  - Learn:
      - Simulate and inspect your first SSM: basic_tutorial/basic_tutorial.ipynb
      - Simulate your first RLSSM: core_tutorials/rlssm_tutorial.ipynb
  - How-to guides:
      - Models and simulation:
          - Configure models and data generation: core_tutorials/tutorial_configs.ipynb
          - Create a custom model: core_tutorials/tutorial_custom_models.ipynb
          - Normalize legacy simulator results: how_to/normalize_simulator_results.md
          - Estimate a likelihood with the KDE class: core_tutorials/kde_class.ipynb
          - Simulate choice-only RL models: core_tutorials/choice_only_rl_models.ipynb
          - Build custom RLSSM components: core_tutorials/rlssm_advanced_tutorial.ipynb
          - Hand off simulated RLSSM data to HSSM: core_tutorials/rlssm_simulation_hssm_handoff.ipynb
      - Data generation:
          - Generate training data for LANs: core_tutorials/tutorial_data_generators.ipynb
          - Track data generation runs with MLflow: core_tutorials/using_mlflow.md
      - Contributing:
          - Write a custom parameter transform: contributing/add_parameter_adapters.md
          - Contribute to ssm-simulators: contributing/README.md
          - Add a new model: contributing/add_models.md
  - Explanations:
      - Simulator and data-generation capabilities: explanations/capabilities.md
      - Simulation vs. analytical solutions (PyDDM): core_tutorials/tutorial_simulators_vs_pyddm.ipynb
      - Why structured observations exist: explanations/structured_observations.md
  - Reference:
      - Structured observation results: reference/observation_result_contract.md
      - API:
          - RLSSM (ssms.rl): api/rlssm.md
          - basic simulators: api/basic_simulators.md
          - configuration exports: api/config.md
          - data generators: api/dataset_generators.md
          - HSSM integration: api/hssm_support.md
          - external simulators: api/external_simulators.md
          - parameter transforms: api/parameter_adapters.md
          - support utils: api/support_utils.md
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

plugins:
  - search
  - autorefs
  - redirects:
      redirect_maps:
        api/ssms.md: api/basic_simulators.md
        core_tutorials/tutorial_capabilities.md: explanations/capabilities.md
  - mkdocs-jupyter:
      execute: False
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - .
            - ssms/config/generator_config
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://mkdocstrings.github.io/objects.inv
            - https://mkdocstrings.github.io/griffe/objects.inv
          options:
            # package-specific: API pages are per-module roll-ups
            # (e.g. ':::ssms.basic_simulators')
            show_submodules: true
            separate_signature: true
            merge_init_into_class: true
            docstring_options:
              ignore_init_summary: true
            docstring_style: numpy
            docstring_section_style: list
            show_root_members_full_path: true
            show_object_full_path: false
            show_category_heading: false
            show_signature_annotations: true
            show_docstring_attributes: false
            show_source: false
            show_root_heading: true
            group_by_category: true
            signature_crossrefs: false
            summary: true
            line_length: 80
            unwrap_annotated: false
            modernize_annotations: true
            filters:
              - "!^_"

theme:
  logo: images/navlogo.png
  favicon: images/navlogo.png
  name: material
  custom_dir: docs/overrides
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - content.code.copy
    - content.action.view
    - content.action.edit
    - header.autohide
    - announce.dismiss
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      scheme: ocean
      primary: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to dark mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: ocean
      primary: custom
      toggle:
        icon: material/brightness-7
        name: Switch to light mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/brightness-4
        name: Switch to automatic mode

copyright: Copyright © 2021 Alexander Fengler. MIT License.

extra:
  homepage: "https://lnccbrown.github.io/ssm-simulators/"
  release_announcement: true
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lnccbrown/ssm-simulators
    - icon: material/forum
      link: https://github.com/lnccbrown/HSSM/discussions

extra_css:
  - "styles/extra.css"

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
